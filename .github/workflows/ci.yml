name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Fetch verified FFmpeg binaries
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'pulse-ffmpeg'
          ./scripts/fetch_ffmpeg.ps1 -Destination $destination
          (Join-Path $destination 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt -r backend/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }
      - name: Run checks
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
          python -m unittest backend.test_backend backend.test_hdr backend.test_projects backend.test_edit_source backend.test_beat_groups backend.test_beat_tools backend.test_video_signals backend.test_video_signals_core backend.test_updates -v
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed.' }
