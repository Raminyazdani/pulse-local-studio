name: Windows portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build-and-publish:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PULSE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Validate version and tag
        run: |
          $version = python -c "from backend.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read application version.' }
          if ($env:PULSE_RELEASE_TAG -cne "v$version") { throw "Tag must be v$version." }
          git rev-parse --verify "refs/tags/$env:PULSE_RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The requested tag does not exist.' }

      - name: Fetch verified FFmpeg binaries
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'pulse-ffmpeg'
          ./scripts/fetch_ffmpeg.ps1 -Destination $destination
          $bin = Join-Path $destination 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'ffmpeg.exe'))) { throw 'FFmpeg was not installed in the expected build directory.' }
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'ffprobe.exe'))) { throw 'FFprobe is missing.' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install build and test dependencies
        run: |
          python -m pip install -r requirements-build.txt -r backend/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }

      - name: Build and test source
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
          python -m unittest backend.test_backend backend.test_hdr backend.test_projects backend.test_updates -v
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed.' }

      - name: Build the application-only portable package
        run: |
          python scripts/build_portable.py --without-data
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed.' }

      - name: Verify the frozen portable app
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Test browser installation failed.' }
          python scripts/verify_portable.py --bundle release/Pulse --expected-media 0 --browser
          if ($LASTEXITCODE -ne 0) { throw 'Frozen portable validation failed.' }

      - name: Validate public release assets
        run: |
          @'
          import hashlib, json, os, zipfile
          from pathlib import Path
          from backend.version import VERSION, GITHUB_REPOSITORY
          archive = Path('release/Pulse-Portable-Windows-x64.zip')
          manifest = json.loads(Path('release/pulse-update.json').read_text(encoding='utf-8'))
          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              assert package.testzip() is None, 'ZIP CRC failure'
              assert all(name.startswith('Pulse/') and '..' not in name.split('/') for name in names)
              forbidden = {'data', 'project backups', 'node_modules', '.venv', '.git'}
              assert not any(any(part.casefold() in forbidden for part in name.split('/')) for name in names), 'Private or development data in release'
              assert 'Pulse/Pulse.exe' in names
              assert 'Pulse/bin/ffmpeg.exe' in names and 'Pulse/bin/ffprobe.exe' in names
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          asset = manifest['asset']
          assert manifest['version'] == VERSION
          assert manifest['repository'] == GITHUB_REPOSITORY == os.environ['GITHUB_REPOSITORY']
          assert asset['name'] == archive.name
          assert asset['sha256'].casefold() == digest
          assert asset['size'] == archive.stat().st_size
          assert asset['url'] == f'https://github.com/{GITHUB_REPOSITORY}/releases/download/v{VERSION}/{archive.name}'
          checksum = archive.with_suffix('.zip.sha256').read_text(encoding='ascii').split()[0]
          assert checksum.casefold() == digest
          print('Public ZIP, version, repository, size and checksum verified.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact validation failed.' }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @('release/Pulse-Portable-Windows-x64.zip', 'release/Pulse-Portable-Windows-x64.zip.sha256', 'release/pulse-update.json')
          gh release view $env:PULSE_RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists. Publish a new version instead of overwriting existing update assets.' }
          gh release create $env:PULSE_RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Pulse $env:PULSE_RELEASE_TAG" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
